<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Version Diff · SoundHound AI OASYS</title>
    <link rel="icon" type="image/svg+xml" href="/brand/logo-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/brand/brand.css" />
    <style>
      .sh-brand-strip {
        position: fixed; top: 0; left: 0; right: 0; z-index: 50;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 20px;
        background: rgba(15, 6, 40, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(167,139,250,0.18);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .sh-brand-strip .sh-mark {
        width: 32px; height: 32px;
        background: linear-gradient(135deg, #6d3eff, #a78bfa);
        border-radius: 8px;
        display:flex; align-items:center; justify-content:center;
        font-weight: 800; font-size: 16px; color: #fff;
        letter-spacing: -1px;
        box-shadow: 0 4px 16px rgba(109,62,255,0.4);
      }
      .sh-brand-strip .sh-name { font-size: 13px; font-weight: 800; color: #fff; line-height: 1.05; letter-spacing: -0.2px; }
      .sh-brand-strip .sh-product { font-size: 10px; font-weight: 300; letter-spacing: 4px; color: #b8b2d4; margin-top: 2px; }
      .sh-brand-strip .sh-tool-tag {
        margin-left: 14px;
        font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
        color: #a78bfa; padding: 4px 12px;
        border: 1px solid rgba(167,139,250,0.18); border-radius: 999px;
        text-decoration: none;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      .sh-brand-strip .sh-tool-tag:hover { background: rgba(109,62,255,0.15); border-color: rgba(167,139,250,0.45); color: #f5f3ff; }
      body { padding-top: 56px; }
    </style>
  </head>
  <body>
    <div class="sh-brand-strip">
      <div class="sh-mark">O</div>
      <div>
        <div class="sh-name">SoundHound AI</div>
        <div class="sh-product">OASYS</div>
      </div>
      <a href="/" class="sh-tool-tag">&larr; Tool Hub</a>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
