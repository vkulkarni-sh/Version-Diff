# OASYS Version Diff — nginx snippet
# Add these two location blocks INSIDE the existing `server { ... }` block in
# /etc/nginx/conf.d/amelia-tools.conf on amedeliveryutil01.
# Mirror the SAME edit into amelia-portal/nginx/... so a portal pull doesn't
# revert it. Then: sudo nginx -t && sudo systemctl reload nginx

    # ── OASYS Version Diff (FastAPI backend + built React frontend) ──
    location /version-diff/ {
        alias /opt/amelia-version-diff/frontend/dist/;
        try_files $uri $uri/ /version-diff/index.html;
    }

    # Version Diff API — the initial version crawl (Confluence page + N Jira
    # version lookups) and the AI summary can take a while; allow long reads.
    location /version-diff/api/ {
        proxy_pass http://127.0.0.1:8004/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
